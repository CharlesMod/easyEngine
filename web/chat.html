<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>easyEngine</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root { --bg:#fff; --fg:#222; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1b1b; --fg:#ddd; --line:#383838; } }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:13px system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  iframe { flex:1; width:100%; border:0; min-height:0; }
</style>
</head>
<body>
<iframe id="ui" title="Llama Chat"></iframe>
<script>
(function () {
  var KEY = 'easyEngine.chat.hash';
  var frame = document.getElementById('ui');

  function store(v) { try { return v === undefined ? localStorage.getItem(KEY) : localStorage.setItem(KEY, v); } catch (e) { return null; } }
  function valid(h) { return typeof h === 'string' && /^#\/[A-Za-z0-9\/_.~%=&?-]{0,300}$/.test(h); }

  // Where the conversation was: an address given to this page wins, else the last one remembered.
  var start = valid(location.hash) ? location.hash : store();
  if (!valid(start)) start = '';
  frame.src = 'ui/' + start;

  var last = start;
  function here() {
    try { return frame.contentWindow.location.hash || ''; } catch (e) { return last; }
  }
  function save() {
    var h = here();
    if (h !== last && valid(h)) { last = h; store(h); }
  }
  // The UI changes its address with history.pushState / replaceState, which raise no event of
  // their own, so each load of the frame wraps the two (the frame is same-origin) to save after
  // them, and listens for the back and forward buttons.
  function watch() {
    var w;
    try { w = frame.contentWindow; } catch (e) { return; }
    ['pushState', 'replaceState'].forEach(function (m) {
      var orig = w.history[m];
      w.history[m] = function () { var r = orig.apply(this, arguments); save(); return r; };
    });
    w.addEventListener('hashchange', save);
    w.addEventListener('popstate', save);
    save();
  }
  frame.addEventListener('load', watch);
  addEventListener('pagehide', save);
})();
</script>
</body>
</html>
